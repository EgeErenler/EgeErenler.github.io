<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Round seal logo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=IBM+Plex+Mono:wght@600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.st-link svg{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
a:hover .st-link svg{transform:rotate(-8deg) scale(1.04)}
@media (prefers-reduced-motion: reduce){.st-link svg{transition:none}}
</style>
</helmet>
<span class="st-link" style="display: inline-flex; width: {{size}}; height: {{size}}; color: {{ink}}">
  <svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Ege Erenler, London">
    <defs>
      <path id="{{topId}}" d="M17 50 A33 33 0 0 1 83 50"></path>
      <path id="{{botId}}" d="M9 50 A41 41 0 0 0 91 50"></path>
    </defs>
    <circle cx="50" cy="50" r="46" fill="none" stroke="{{ink}}" stroke-width="3"></circle>
    <text font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="{{ink}}"><textPath href="{{topHref}}" startOffset="50%" text-anchor="middle">EGE ERENLER</textPath></text>
    <text font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="{{ink}}"><textPath href="{{botHref}}" startOffset="50%" text-anchor="middle">LONDON</textPath></text>
    <circle cx="12.5" cy="50" r="1.8" fill="{{ink}}"></circle>
    <circle cx="87.5" cy="50" r="1.8" fill="{{ink}}"></circle>
    <text x="50" y="58" text-anchor="middle" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-weight="900" font-size="26" letter-spacing="-2" fill="{{ink}}">ee</text>
    <circle cx="65" cy="55" r="3.5" fill="{{accent}}"></circle>
  </svg>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ink":{"editor":"color","default":"#121212"},"accent":{"editor":"color","default":"#FF6A2B"},"size":{"editor":"text","default":"64px"},"$preview":{"width":200,"height":200}}'>
let STAMP_N = 0;
class Component extends DCLogic {
  constructor(props) {
    super(props);
    STAMP_N += 1;
    this.pid = 'st-ring-' + STAMP_N;
  }
  renderVals() {
    return {
      ink: this.props.ink || '#121212',
      accent: this.props.accent || '#FF6A2B',
      size: this.props.size || '64px',
      topId: this.pid + '-t', botId: this.pid + '-b',
      topHref: '#' + this.pid + '-t', botHref: '#' + this.pid + '-b'
    };
  }
}
</script>
</body>
</html>
